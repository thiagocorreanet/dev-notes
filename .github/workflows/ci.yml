name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Code quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Check types
        run: npm run typecheck
      - name: Editor tests
        run: npm run test:run
      - name: Local service tests
        run: npm run test:local
      - name: Automation tests
        run: npm run test:automation
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Browser workflows
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-dist
          path: dist/
      - name: Install test browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Run browser workflows
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  verify:
    name: Required checks
    if: always()
    needs: [validate, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful code and browser checks
        env:
          CODE_RESULT: ${{ needs.validate.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$CODE_RESULT" = success && test "$BROWSER_RESULT" = success
