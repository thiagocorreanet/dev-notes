name: Label bug reports

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-labels-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Issue events use the default branch. Never check out contributor code here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { labelsForIssue, managedLabels } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/automation/issue-labels.ts`)
            const { owner, repo } = context.repo
            const issue_number = context.payload.issue.number
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number })
            if (!issue.labels.some(label => label.name === 'bug')) return
            const wanted = labelsForIssue(issue.body || '')
            const existing = issue.labels.map(label => label.name)
            for (const name of wanted) {
              if (!existing.includes(name)) await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [name] })
            }
            for (const name of existing) {
              if (managedLabels.includes(name) && !wanted.includes(name)) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(error => {
                  if (error.status !== 404) throw error
                })
              }
            }
